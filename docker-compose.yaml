services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plata
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: plata
    ports:
      - "5433:5432"
    volumes:
      -  ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plata"]
      interval: 2s
      timeout: 2s
      retries: 15
  
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://plata:dev@postgres:5432/plata
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure


  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.0
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./api:/spec:ro